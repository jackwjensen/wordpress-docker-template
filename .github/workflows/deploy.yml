name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Never let two deploys run at once; queue instead of cancelling.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The deploy is dormant until you point it at a server: set the DEPLOY_HOST
    # and DEPLOY_SSH_KEY repository secrets to activate it. With no DEPLOY_HOST
    # (e.g. a freshly cloned template), the deploy step is skipped and the job
    # still succeeds — so cloning this repo never produces a red deploy.
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - name: Deployment target check
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::notice::No DEPLOY_HOST secret set — skipping deploy. Set DEPLOY_HOST and DEPLOY_SSH_KEY to deploy to your own server."
          else
            echo "Deploy target configured; proceeding with deploy."
          fi

      - name: Deploy over SSH
        if: env.DEPLOY_HOST != ''
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          # Defaults to a non-root `deploy` user. Give it docker-group membership and
          # ownership of DEPLOY_PATH on your server, or set the DEPLOY_USER variable to
          # whatever account you actually use. Deploying as root means any compromise of
          # this workflow, the key secret, or the third-party action is a full host
          # takeover; a `deploy` account in the docker group is one rung down from that
          # (docker-group is still root-adjacent -- it can bind-mount / into a container).
          username: ${{ vars.DEPLOY_USER || 'deploy' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # Optional but strongly recommended: pin your server's SSH host key so a
          # hijacked DNS record cannot present its own and collect a key with write
          # access to your server. Left empty, the action skips verification entirely.
          #
          # Get the value by TESTING, not by reading. This action downloads drone-ssh
          # (Go crypto/ssh), whose host-key preference puts ECDSA above ed25519 -- the
          # reverse of OpenSSH -- so if your server offers several host key types, the
          # one `ssh -v` shows you is very likely NOT the one this action negotiates,
          # and the deploy fails with `host key fingerprint mismatch`. Try the ECDSA
          # value first:  ssh-keyscan -t ecdsa <host> | ssh-keygen -lf -
          fingerprint: ${{ vars.DEPLOY_HOST_FINGERPRINT }}
          script_stop: true
          script: |
            set -e
            # Where this repo is checked out on the server. Override with the
            # DEPLOY_PATH repository variable if your host uses another layout.
            APP_DIR="${{ vars.DEPLOY_PATH || format('/opt/apps/{0}', github.event.repository.name) }}"
            cd "$APP_DIR"

            # Capture the current commit so we can roll back on failure.
            PREV_COMMIT=$(git rev-parse HEAD)
            rollback() {
              echo "Deployment failed! Rolling back to $PREV_COMMIT..."
              git checkout "$PREV_COMMIT"
              docker compose up --build --force-recreate -d
              echo "Rollback complete."
              exit 1
            }
            trap rollback ERR

            git pull origin master
            docker image prune -f --filter "until=72h" || true

            # Refresh every image first. Without a pull the server keeps the first copy of
            # each tag it ever downloaded, so the WordPress base and mysql:8.4 stop receiving
            # the patches their tags exist to carry. --ignore-buildable skips the image this
            # repo builds (pulling it would fail). The rollback above stays unpulled on
            # purpose: it must not depend on the registry once the deploy has already failed.
            docker compose pull --ignore-buildable
            docker compose build --pull

            # Rebuild the image and recreate containers.
            docker compose up --build --force-recreate -d

            # Verify WordPress actually SERVES HTTP, not merely that containers are
            # "running" (a container can be up while WordPress returns 500 on a DB
            # or PHP error). Probes inside the container, so no host port is needed.
            # A non-zero exit trips the ERR trap above and rolls the deploy back.
            bash scripts/healthcheck.sh "http://localhost/" 30 5 wordpress

            echo "Deployment successful!"
