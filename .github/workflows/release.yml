name: Release

# Publishes the image to GHCR and creates a GitHub Release when a version tag is
# pushed (e.g. `git tag v1.0.0 && git push origin v1.0.0`). Authentication is
# keyless: the built-in GITHUB_TOKEN pushes to GHCR and OIDC signs provenance —
# no stored registry secret.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release
  packages: write # push the image to GHCR
  id-token: write # keyless build-provenance (OIDC)
  attestations: write # write the attestation

jobs:
  release:
    name: Build, publish to GHCR, and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Never publish an image that doesn't pass the smoke test. Retry to ride
      # out transient Docker Hub pull rate-limits on shared runners.
      - name: Smoke test before publishing
        run: |
          for attempt in 1 2 3; do
            if bash tests/smoke.sh; then exit 0; fi
            echo "::warning::smoke attempt $attempt failed (often a Docker Hub pull limit) — retrying after backoff"
            sleep $((attempt * 20))
          done
          echo "::error::smoke test failed after 3 attempts"
          exit 1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Attest build provenance (keyless)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
