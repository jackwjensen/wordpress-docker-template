version: 2
updates:
  # Base images (Dockerfile FROM). Every tag is pinned to one exact release, so these
  # proposals are how a pin moves.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    groups:
      docker:
        patterns: ["*"]
    commit-message:
      prefix: docker

  # Image tags in the compose files (mysql) -- a separate ecosystem; `docker` reads
  # only Dockerfiles.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    groups:
      docker-compose:
        patterns: ["*"]
    commit-message:
      prefix: docker

  # GitHub Actions used by the CI, deploy, and release workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
