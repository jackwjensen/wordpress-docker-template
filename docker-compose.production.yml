# Production overlay — merged via COMPOSE_FILE=docker-compose.yml:docker-compose.production.yml
# in the server's .env (scripts/setup-server.sh writes it). Container names, the read-only
# setup and the password from .env come from the base file; this changes only what production
# changes: no published ports, the proxy network, production settings, and a restart policy on
# every service.
services:
  wordpress:
    # The reverse proxy forwards to <project>-web:80; OpenLiteSpeed serves :80 itself.
    ports: !override []
    environment:
      WORDPRESS_DEBUG: "false"
      # DISALLOW_FILE_MODS: themes and plugins come from git (installed locally, committed) and
      # are bind-mounted from the deploy user's checkout, which www-data cannot write — so the
      # admin must not offer installs or updates that would fail.
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', false);
        define('WP_DEBUG_DISPLAY', false);
        define('DISALLOW_FILE_EDIT', true);
        define('DISALLOW_FILE_MODS', true);
        define('WP_AUTO_UPDATE_CORE', false);
        define('WP_CACHE', true);
    networks:
      - default
      - nginx-proxy-network
    restart: unless-stopped

  mysql:
    ports: !override []
    restart: unless-stopped

networks:
  nginx-proxy-network:
    external: true
