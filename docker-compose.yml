# Local development. No service has a restart policy (engineering-standards rule
# infrastructure.md): every local project shares the dev ports, so this stack runs only when
# started and never comes back on its own after a Docker Desktop restart to take the ports from
# another project. Production's restart: unless-stopped is in docker-compose.production.yml.
services:
  wordpress:
    build:
      context: .
    image: wordpress-docker-template:local
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: mysql
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: WordPress_Dev123!
      WORDPRESS_DEBUG: "true"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', true);
        define('SCRIPT_DEBUG', true);
    volumes:
      - ./wp-content/themes:/var/www/html/wp-content/themes
      - ./wp-content/plugins:/var/www/html/wp-content/plugins
      - wp-uploads:/var/www/html/wp-content/uploads
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: WordPress_Dev123!
      MYSQL_DATABASE: wordpress
    ports:
      # Dev port registry (engineering-standards infrastructure.md): the database is always
      # 127.0.0.1:3307 — loopback only, and never 3306, which belongs to a local MySQL install.
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # Authenticate via MYSQL_PWD so the password never appears on the argv
      # (avoids the "insecure password on the command line" warning).
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  wpcli:
    image: wordpress:cli-php8.4
    depends_on:
      wordpress:
        condition: service_started
    volumes:
      - ./wp-content/themes:/var/www/html/wp-content/themes
      - ./wp-content/plugins:/var/www/html/wp-content/plugins
      - wp-uploads:/var/www/html/wp-content/uploads
    environment:
      WORDPRESS_DB_HOST: mysql
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: WordPress_Dev123!
    profiles:
      - cli

volumes:
  mysql-data:
  wp-uploads:
