# Local development. Ports follow the Allegro IT dev port registry (engineering-standards,
# infrastructure.md): 8080 the site, 127.0.0.1:3307 the database. Every local project shares
# those numbers and only one runs at a time, so no service here has a restart policy: the stack
# runs only when started and never comes back on its own after a Docker Desktop restart to take
# the ports from another project. Production's restart: unless-stopped lives in
# docker-compose.production.yml, on every service.
#
# MYSQL_ROOT_PASSWORD comes from .env and is never committed: ./dev.sh up (dev.bat up)
# generates it locally, scripts/setup-server.sh on a server.
services:
  # OpenLiteSpeed + lsphp with WordPress — one container that serves HTTP itself. It listens on
  # 8080 inside the container too, so WordPress's calls to its own address
  # (http://localhost:8080 — WP-Cron, Site Health's loopback test) reach this same container.
  wordpress:
    build:
      context: .
    image: wordpress-docker-template:local # standards: dependency-unpinned exempt -- the name this file's own build: gives ./Dockerfile; never pulled from a registry
    # <project>-web: the name the reverse proxy forwards to (port 80). Interpolated, because
    # every site built from this template is its own instance (infrastructure.md).
    container_name: ${COMPOSE_PROJECT_NAME:-wordpress}-web
    ports:
      - "8080:8080"
    environment:
      WORDPRESS_DB_HOST: mysql
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env - ./dev.sh up generates it}
      WORDPRESS_DEBUG: "true"
      # Written into wp-config.php at every container start (docker/openlitespeed/) —
      # change it here and restart; never edit wp-config.php itself.
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', true);
        define('SCRIPT_DEBUG', true);
        define('WP_CACHE', true);
    # Read-only image: everything the container writes is one of the mounts below. It runs as
    # www-data (the image's USER), so the tmpfs mounts other than /tmp are given to uid 33.
    read_only: true
    tmpfs:
      # OpenLiteSpeed's sockets and swap, PHP uploads (up to 256M, config/uploads.ini) and
      # WP-CLI's cache. RAM, so sized: room for one maximum upload plus working space.
      - /tmp:size=512m,mode=1777
      # Rewritten from the image at every start (the entrypoint): OpenLiteSpeed writes parsed
      # copies of its configuration beside it, and a downloaded IP list into admin/conf.
      - /usr/local/lsws/conf:size=4m,uid=33,gid=33,mode=0750
      - /usr/local/lsws/admin/conf:size=4m,uid=33,gid=33,mode=0750
      - /usr/local/lsws/tmp:size=16m,uid=33,gid=33,mode=0750
      - /usr/local/lsws/cgid:size=1m,uid=33,gid=33,mode=0750
    volumes:
      # Core, the generated wp-config.php (its secret keys) and .htaccess (permalinks, LiteSpeed
      # Cache's rules) — kept across restarts; the entrypoint upgrades core from a newer image.
      - wp-html:/var/www/html
      - ./wp-content/themes:/var/www/html/wp-content/themes
      - ./wp-content/plugins:/var/www/html/wp-content/plugins
      - wp-uploads:/var/www/html/wp-content/uploads
      # OpenLiteSpeed's logs (error.log, access.log, stderr.log = PHP's errors) and the page
      # cache, which the entrypoint empties at every start.
      - ols-logs:/usr/local/lsws/logs
      - ols-cache:/usr/local/lsws/cachedata
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4.11
    container_name: ${COMPOSE_PROJECT_NAME:-wordpress}-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env - ./dev.sh up generates it}
      MYSQL_DATABASE: wordpress
    ports:
      # Loopback only (the short form would put the database on the network), and never 3306,
      # which a MySQL installed on the host may take back at any update.
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # Authenticate via MYSQL_PWD so the password never appears on the argv
      # (avoids the "insecure password on the command line" warning).
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mysql-data:
  wp-html:
  wp-uploads:
  ols-logs:
  ols-cache:
