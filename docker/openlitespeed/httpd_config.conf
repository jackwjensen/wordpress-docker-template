#
# OpenLiteSpeed server configuration for the WordPress image.
#
# Based on the defaults shipped in litespeedtech/openlitespeed:1.9.2-lsphp85 — only what a
# WordPress site needs is changed: PHP and the files as www-data, one virtual host, plain HTTP
# only, no web admin, the request-body limit of config/uploads.ini.
#
# Local:      http://localhost:8080 — plain HTTP, and the server listens on 8080 itself, so
#             WordPress's calls to its own address (WP-Cron, Site Health) reach this container.
#             Never add HTTPS or an http→https redirect here: port 8080 is shared by every local
#             project, and a redirect on it is remembered by the browser for all of them.
# Production: plain HTTP on 80 behind a reverse proxy, which terminates TLS and sends
#             X-Forwarded-Proto (wp-config.php turns that into $_SERVER['HTTPS']).
#
serverName
user                             www-data
group                            www-data
priority                         0
autoRestart                      1
chrootPath                       /
enableChroot                     0
inMemBufSize                     60M
swappingDir                      /tmp/lshttpd/swap
autoFix503                       1
gracefulRestartTimeout           300
mime                             conf/mime.properties
showVersionNumber                0
adminEmails                      root@localhost
indexFiles                       index.php, index.html
# No web admin: nothing publishes its port, and a console nobody uses is only attack surface.
disableWebAdmin                  1

errorlog logs/error.log {
        logLevel             WARN
        debugLevel           0
        rollingSize          10M
        enableStderrLog      1
}
accessLog logs/access.log {
        rollingSize          10M
        keepDays             7
        compressArchive      0
        logReferer           1
        logUserAgent         1
}

expires {
    enableExpires           1
    expiresByType           image/*=A604800,text/css=A604800,application/x-javascript=A604800,application/javascript=A604800,font/*=A604800,application/x-font-ttf=A604800
}

tuning{
    maxConnections               10000
    maxSSLConnections            10000
    connTimeout                  300
    maxKeepAliveReq              10000
    smartKeepAlive               0
    keepAliveTimeout             5
    sndBufSize                   0
    rcvBufSize                   0
    gzipStaticCompressLevel      6
    gzipMaxFileSize              10M
    eventDispatcher              best
    maxCachedFileSize            4096
    totalInMemCacheSize          20M
    maxMMapFileSize              256K
    totalMMapCacheSize           40M
    useSendfile                  1
    fileETag                     28
    SSLCryptoDevice              null
    maxReqURLLen                 32768
    maxReqHeaderSize             65536
    # Same upload limit as PHP (config/uploads.ini: post_max_size).
    maxReqBodySize               256M
    maxDynRespHeaderSize         32768
    maxDynRespSize               2047M
    enableGzipCompress           1
    enableBrCompress             4
    enableDynGzipCompress        1
    gzipCompressLevel            6
    brStaticCompressLevel        6
    compressibleTypes            default
    gzipAutoUpdateStatic         1
    gzipMinFileSize              300
    # QUIC/HTTP3 needs TLS, which this server never terminates.
    quicEnable                   0
}

accessDenyDir{
    dir                  /
    dir                  /etc/*
    dir                  /dev/*
    dir                  conf/*
    dir                  admin/conf/*
}

fileAccessControl{
    followSymbolLink                            1
    checkSymbolLink                             0
    requiredPermissionMask                      000
    restrictedPermissionMask                    000
}

perClientConnLimit{
    staticReqPerSec                          0
    dynReqPerSec                             0
    outBandwidth                             0
    inBandwidth                              0
    softLimit                                10000
    hardLimit                                10000
    gracePeriod                              15
    banPeriod                                300
}

CGIRLimit{
    maxCGIInstances                         20
    minUID                                  11
    minGID                                  10
    priority                                0
    CPUSoftLimit                            10
    CPUHardLimit                            50
    memSoftLimit                            2047M
    memHardLimit                            2047M
    procSoftLimit                           400
    procHardLimit                           450
}

accessControl{
    allow                                   ALL
    deny
}

# lsphp 8.5 over LSAPI. It does NOT inherit the container's environment — which is why
# wp-config.php is written with literal values at start (docker/openlitespeed/entrypoint.sh).
extProcessor lsphp{
    type                            lsapi
    address                         uds://tmp/lshttpd/lsphp.sock
    maxConns                        10
    env                             PHP_LSAPI_CHILDREN=10
    env                             LSAPI_AVOID_FORK=200M
    initTimeout                     60
    retryTimeout                    0
    persistConn                     1
    pcKeepAliveTimeout
    respBuffer                      0
    autoStart                       1
    path                            /usr/local/lsws/lsphp85/bin/lsphp
    backlog                         100
    instances                       1
    priority                        0
    memSoftLimit                    0
    memHardLimit                    0
    procSoftLimit                   1400
    procHardLimit                   1500
}

scriptHandler{
    add lsapi:lsphp  php
}

# LiteSpeed's page cache. Off by default at server level: the LiteSpeed Cache plugin switches it
# on per response with X-LiteSpeed-Cache-Control headers (and knows to skip carts, checkouts and
# logged-in users). This module is what nginx and Apache do not have. With it loaded, the server
# sets X-LSCACHE in $_SERVER, which is how the plugin knows it may cache.
module cache {
    ls_enabled          1
    checkPrivateCache   1
    checkPublicCache    1
    maxCacheObjSize     10000000
    maxStaleAge         200
    qsCache             1
    reqCookieCache      1
    respCookieCache     1
    ignoreReqCacheCtrl  1
    ignoreRespCacheCtrl 0
    enableCache         0
    expireInSeconds     3600
    enablePrivateCache  0
    privateExpireInSeconds 3600
}

virtualHost wordpress{
    vhRoot                   /var/www/html/
    configFile               conf/vhosts/wordpress/vhconf.conf
    allowSymbolLink          1
    enableScript             1
    restrained               1
    setUIDMode               0
    chrootMode               0
}

listener Local{
    address                  *:8080
    secure                   0
    map                      wordpress *
}

listener Production{
    address                  *:80
    secure                   0
    map                      wordpress *
}
