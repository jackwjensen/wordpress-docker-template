# The WordPress virtual host: WordPress in /var/www/html.
#
# Permalinks come from .htaccess, as on any LiteSpeed host: WordPress writes its rules there
# (Settings → Permalinks, or `wp rewrite flush --hard`), and so does the LiteSpeed Cache plugin.
# autoLoadHtaccess makes OpenLiteSpeed read them without a restart.
docRoot                   $VH_ROOT
enableGzip                1

# Requests and errors go to the server's logs in /usr/local/lsws/logs/ (a virtual host logs
# nothing unless told to).
errorlog $SERVER_ROOT/logs/error.log {
    useServer             1
}
accesslog $SERVER_ROOT/logs/access.log {
    useServer             1
}

index {
    useServer             0
    indexFiles            index.php, index.html
}

rewrite {
    enable                1
    autoLoadHtaccess      1
}

# Dotfiles (.htaccess, .git …) are never served; .well-known is.
context exp:^/\.(?!well-known) {
    allowBrowse           0
}
